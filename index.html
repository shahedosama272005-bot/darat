

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darat Hub | Community Workspace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7f4;--white:#fff;--green:#245b49;--green2:#347b62;--pale:#e8f1eb;--text:#263c35;--muted:#829089;--border:#e4eae5;--red:#b85454}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{display:flex;min-height:100vh}
.sidebar{width:235px;background:white;border-right:1px solid var(--border);padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:8px 10px 25px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-size:23px}
.brand h2{font-size:16px;margin:0 0 5px;letter-spacing:1px}
.brand small{color:var(--muted);font-size:11px}
.workspace{background:var(--pale);padding:12px;border-radius:10px;font-size:11px;font-weight:bold;margin-bottom:24px}
.nav-label{font-size:10px;color:#98a39b;letter-spacing:1.5px;margin:0 10px 10px}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:#718078;font-size:13px}
.nav button.active,.nav button:hover{background:var(--pale);color:var(--green);font-weight:bold}
.sidebar-bottom{margin-top:auto;padding-top:20px}
.profile{border-top:1px solid var(--border);padding:17px 5px;display:flex;gap:10px;align-items:center;font-size:12px}
.avatar{width:36px;height:36px;background:var(--pale);border-radius:12px;display:grid;place-items:center;font-weight:bold;color:var(--green)}
.main{flex:1;min-width:0}
.topbar{height:70px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:12px}
.top-actions{display:flex;gap:9px;align-items:center}
.content{max-width:1300px;margin:auto;padding:30px}
h1{font-size:28px;margin:0 0 8px}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:15px;margin:0 0 8px}
p{line-height:1.6}
.muted{font-size:12px;color:var(--muted)}
.eyebrow{font-size:10px;color:var(--green2);font-weight:bold;letter-spacing:1.5px;margin:0 0 10px}
.welcome,.page-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}
.banner{background:var(--green);color:white;border-radius:18px;padding:28px;margin-bottom:20px}
.banner h2{font-size:24px}
.banner p{color:#d3e3d9;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}
.stat,.panel,.record{background:white;border:1px solid var(--border);border-radius:15px;padding:18px}
.stat{color:var(--text);text-align:left}
.stat-number{font-size:30px;font-weight:bold;margin-top:10px}
.stat-label{font-size:12px;color:var(--muted)}
.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}
.panel{min-width:0}
.panel-heading{margin-bottom:15px}
.quick{width:100%;padding:13px;margin:5px 0;background:white;border:1px solid var(--border);border-radius:10px;text-align:left;color:var(--text)}
.quick:hover{background:var(--pale)}
.primary,.secondary,.delete,.lang{border-radius:9px;padding:11px 14px;font-size:12px}
.primary{background:var(--green);border:1px solid var(--green);color:white;font-weight:bold}
.primary:hover{background:var(--green2)}
.secondary,.lang{background:white;border:1px solid var(--border);color:var(--text)}
.delete{background:white;border:1px solid #f1dada;color:var(--red)}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.search{width:100%;max-width:400px;padding:11px;border:1px solid var(--border);border-radius:10px;background:white}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.record{min-width:0;display:flex;flex-direction:column;gap:9px}
.record h3{overflow-wrap:anywhere}
.record-description{font-size:12px;line-height:1.7;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.tag{display:inline-block;background:var(--pale);color:var(--green);font-size:10px;padding:6px 9px;border-radius:7px;overflow-wrap:anywhere}
.record-meta{font-size:11px;color:var(--muted);margin-top:auto;padding-top:9px}
.record-actions{display:flex;gap:7px;border-top:1px solid var(--border);padding-top:12px}
.record-actions button{flex:1}
.empty{background:white;border:1px dashed #d4dfd7;border-radius:14px;padding:45px 20px;text-align:center;color:var(--muted);font-size:13px}
.activity{padding:12px 0;border-bottom:1px solid var(--border);font-size:12px}
.modal-backdrop{position:fixed;inset:0;background:#10271b90;display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.modal{background:white;border-radius:17px;padding:24px;width:min(500px,100%);max-height:92vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:12px;font-weight:bold}
.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;background:white;color:var(--text)}
.field textarea{min-height:90px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.toast{position:fixed;bottom:20px;right:20px;max-width:90%;background:var(--green);color:white;padding:14px 18px;border-radius:10px;font-size:12px;z-index:30;overflow-wrap:anywhere}
.footer{text-align:center;padding:30px;color:#9ba69e;font-size:10px}
.mobile-menu{display:none}
[dir=rtl] body{font-family:Arial,sans-serif}
[dir=rtl] .sidebar{border-right:0;border-left:1px solid var(--border)}
[dir=rtl] .nav button,[dir=rtl] .stat,[dir=rtl] .quick{text-align:right}
[dir=rtl] .toast{right:auto;left:20px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
 .sidebar{position:fixed;z-index:15;inset:0 auto 0 0;transform:translateX(-105%);transition:.2s;box-shadow:0 0 30px #0001}
 [dir=rtl] .sidebar{inset:0 0 0 auto;transform:translateX(105%)}
 .sidebar.open{transform:translateX(0)}
 .mobile-menu{display:inline-block}
 .topbar{height:62px;padding:0 13px}
 .content{padding:22px 14px}
 .stats{gap:9px}
 .stat{padding:13px}
 .stat-number{font-size:25px}
 .columns,.cards{grid-template-columns:1fr}
 .banner{padding:22px}
 h1{font-size:24px}
 .page-heading{align-items:flex-start}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
"use strict";

const SUPABASE_URL = "https://wvhdsxdrndodzbgtgvmy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_y2QmmhEJJc5-Wswltfue_A_nIcsqJkH";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const tables = {
  ideas: {
    label: "Ideas",
    ar: "الأفكار",
    icon: "✳",
    fields: [
      {key:"title", label:"Title", ar:"العنوان", required:true},
      {key:"description", label:"Description", ar:"الوصف", type:"textarea"},
      {key:"status", label:"Status", ar:"الحالة", type:"select", options:["new","reviewing","approved","rejected"]}
    ]
  },
  events: {
    label:"Events", ar:"الفعاليات", icon:"▣",
    fields:[
      {key:"title",label:"Title",ar:"العنوان",required:true},
      {key:"description",label:"Description",ar:"الوصف",type:"textarea"},
      {key:"event_date",label:"Event date",ar:"تاريخ الفعالية",type:"date"},
      {key:"status",label:"Status",ar:"الحالة",type:"select",options:["planned","in_progress","completed","cancelled"]}
    ]
  },
  tasks: {
    label:"Tasks", ar:"المهام", icon:"☷",
    fields:[
      {key:"title",label:"Title",ar:"العنوان",required:true},
      {key:"description",label:"Description",ar:"الوصف",type:"textarea"},
      {key:"due_date",label:"Due date",ar:"موعد التسليم",type:"date"},
      {key:"priority",label:"Priority",ar:"الأولوية",type:"select",options:["low","medium","high"]},
      {key:"status",label:"Status",ar:"الحالة",type:"select",options:["todo","in_progress","done"]}
    ]
  },
  meetings: {
    label:"Meetings", ar:"الاجتماعات", icon:"◷",
    fields:[
      {key:"title",label:"Title",ar:"العنوان",required:true},
      {key:"meeting_date",label:"Meeting date",ar:"تاريخ الاجتماع",type:"date"},
      {key:"notes",label:"Notes",ar:"الملاحظات",type:"textarea"}
    ]
  },
  content: {
    label:"Content Studio", ar:"استوديو المحتوى", icon:"▤",
    fields:[
      {key:"title",label:"Title",ar:"العنوان",required:true},
      {key:"platform",label:"Platform",ar:"المنصة",type:"select",options:["Instagram","Facebook","TikTok","Other"]},
      {key:"caption",label:"Caption / notes",ar:"النص أو الملاحظات",type:"textarea"},
      {key:"publish_date",label:"Publish date",ar:"تاريخ النشر",type:"date"},
      {key:"status",label:"Status",ar:"الحالة",type:"select",options:["idea","draft","ready","published"]}
    ]
  },
  team: {
    label:"Team", ar:"الفريق", icon:"♧",
    fields:[
      {key:"title",label:"Full name",ar:"الاسم الكامل",required:true},
      {key:"role",label:"Role",ar:"الدور",type:"select",options:["Volunteer","Coordinator","Content Creator","Event Organizer"]}
    ]
  }
};

const translations = {
  en: {
    dashboard:"Dashboard",welcome:"Good to see you.",overview:"Your community team's shared workspace.",
    intro:"DARAT COMMUNITY",hero:"Ideas grow better together.",total:"Ideas",quick:"Quick actions",
    recent:"Recent activity",add:"Add new",search:"Search...",save:"Save",cancel:"Cancel",
    edit:"Edit",delete:"Delete",empty:"Nothing here yet.",emptyText:"Add your first item to get started.",
    saved:"Saved successfully.",deleted:"Deleted successfully.",confirm:"Delete this item?",
    loading:"Connecting to the shared workspace...",loadError:"Could not load data",
    connection:"Connection status",connected:"Connected to shared database",
    teamNote:"The people behind our community work.",date:"Date",language:"العربية",
    newItem:"Create item",editItem:"Edit item",noResults:"No matching items.",
    all:"All",volunteer:"Volunteer",items:"items",retry:"Retry",footer:"A shared space for people who make good things happen."
  },
  ar: {
    dashboard:"لوحة التحكم",welcome:"أهلًا بعودتك.",overview:"مساحة العمل المشتركة لفريق المجتمع.",
    intro:"مجتمع دارَت",hero:"الأفكار تكبر لما نشتغل مع بعض.",total:"الأفكار",quick:"إجراءات سريعة",
    recent:"آخر النشاطات",add:"إضافة جديد",search:"بحث...",save:"حفظ",cancel:"إلغاء",
    edit:"تعديل",delete:"حذف",empty:"لا توجد بيانات بعد.",emptyText:"أضيفي أول عنصر للبدء.",
    saved:"تم الحفظ بنجاح.",deleted:"تم الحذف بنجاح.",confirm:"هل تريدين حذف هذا العنصر؟",
    loading:"جارٍ الاتصال بمساحة العمل المشتركة...",loadError:"تعذر تحميل البيانات",
    connection:"حالة الاتصال",connected:"متصل بقاعدة البيانات المشتركة",
    teamNote:"الأشخاص وراء أعمالنا المجتمعية.",date:"التاريخ",language:"English",
    newItem:"إنشاء عنصر",editItem:"تعديل العنصر",noResults:"لا توجد نتائج مطابقة.",
    all:"الكل",volunteer:"متطوع",items:"عناصر",retry:"إعادة المحاولة",footer:"مساحة مشتركة للأشخاص الذين يصنعون أثرًا حقيقيًا."
  }
};

let language = "en";
let page = "dashboard";
let data = {};
let editing = null;
let searchQuery = "";
let busy = false;
let connectionError = "";

function tr(key) {
  return translations[language][key] || key;
}
function label(key) {
  return language === "ar" ? (tables[key]?.ar || key) : (tables[key]?.label || key);
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}
function showToast(message) {
  document.getElementById("toast-root").innerHTML = `<div class="toast">${esc(message)}</div>`;
  setTimeout(() => {
    document.getElementById("toast-root").innerHTML = "";
  }, 3500);
}
function fieldLabel(field) {
  return language === "ar" ? field.ar : field.label;
}
function statusLabel(value) {
  const en = {
    new:"New",reviewing:"Reviewing",approved:"Approved",rejected:"Rejected",
    planned:"Planned",in_progress:"In progress",completed:"Completed",cancelled:"Cancelled",
    todo:"To do",done:"Done",low:"Low",medium:"Medium",high:"High",
    idea:"Idea",draft:"Draft",ready:"Ready",published:"Published",
    Volunteer:"Volunteer",Coordinator:"Coordinator",
    "Content Creator":"Content Creator","Event Organizer":"Event Organizer"
  };
  const ar = {
    new:"جديدة",reviewing:"قيد المراجعة",approved:"مقبولة",rejected:"مرفوضة",
    planned:"مخططة",in_progress:"قيد التنفيذ",completed:"مكتملة",cancelled:"ملغاة",
    todo:"للتنفيذ",done:"منجزة",low:"منخفضة",medium:"متوسطة",high:"عالية",
    idea:"فكرة",draft:"مسودة",ready:"جاهز",published:"منشور",
    Volunteer:"متطوع",Coordinator:"منسق",
    "Content Creator":"صانع محتوى","Event Organizer":"منظم فعاليات"
  };
  return (language === "ar" ? ar : en)[value] || value || "—";
}
function formatDate(value) {
  if (!value) return "";
  const d = new Date(value.length === 10 ? value + "T12:00:00" : value);
  if (Number.isNaN(d.getTime())) return esc(value);
  return d.toLocaleDateString(language === "ar" ? "ar-JO" : "en-GB", {
    day:"numeric",month:"short",year:"numeric"
  });
}

async function refreshData() {
  const keys = Object.keys(tables);
  const results = await Promise.all(keys.map(key =>
    db.from(key).select("*")
  ));
  for (let i = 0; i < keys.length; i++) {
    if (results[i].error) {
      throw new Error(keys[i] + ": " + results[i].error.message);
    }
    data[keys[i]] = results[i].data || [];
  }
  connectionError = "";
}

async function load() {
  const root = document.getElementById("root");
  root.innerHTML = `<div class="content"><h2>${tr("loading")}</h2></div>`;
  try {
    await refreshData();
  } catch (error) {
    connectionError = error.message;
    console.error("Darat Hub database error:", error);
  }
  render();

  setInterval(async () => {
    if (busy || document.getElementById("modal-root").innerHTML) return;
    try {
      await refreshData();
      render();
    } catch (error) {
      connectionError = error.message;
      console.error("Refresh error:", error);
    }
  }, 15000);
}

function switchPage(key) {
  page = key;
  searchQuery = "";
  render();
  window.scrollTo(0, 0);
}
function toggleLanguage() {
  language = language === "en" ? "ar" : "en";
  render();
}
function retryLoad() {
  load();
}
function navButton(key) {
  return `<button class="${page === key ? "active" : ""}" onclick="switchPage('${key}')">${tables[key]?.icon || "▦"} &nbsp; ${esc(label(key))}</button>`;
}
function shell(content) {
  const direction = language === "ar" ? "rtl" : "ltr";
  return `<div class="app" dir="${direction}">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="logo">♡</div><div><h2>DARAT HUB</h2><small>Community Workspace</small></div></div>
      <div class="workspace">● &nbsp; DARAT COMMUNITY</div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav">
        <button class="${page === "dashboard" ? "active" : ""}" onclick="switchPage('dashboard')">▦ &nbsp; ${tr("dashboard")}</button>
        ${Object.keys(tables).map(navButton).join("")}
      </nav>
      <div class="sidebar-bottom">
        <div class="profile"><div class="avatar">D</div><div><strong>Darat Team</strong><br><small>${tr("volunteer")}</small></div></div>
        <button class="lang" style="width:100%" onclick="toggleLanguage()">◎ &nbsp; ${tr("language")}</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="secondary mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
          <span>Darat Hub &nbsp; › &nbsp; ${page === "dashboard" ? tr("dashboard") : esc(label(page))}</span>
        </div>
        <div class="top-actions"><span class="muted">${formatDate(new Date().toISOString())}</span><button class="lang" onclick="toggleLanguage()">${tr("language")}</button></div>
      </header>
      <section class="content">${content}<div class="footer">${tr("footer")}</div></section>
    </main>
  </div>`;
}

function dashboard() {
  const stats = ["ideas","events","tasks","content"];
  const quick = ["ideas","events","tasks","meetings","content"];
  const recent = Object.entries(tables)
    .flatMap(([key]) => (data[key] || []).map(item => ({
      ...item, module:key
    })))
    .sort((a,b) => String(b.created_at || "").localeCompare(String(a.created_at || "")))
    .slice(0,6);

  return `<div class="welcome"><div><p class="eyebrow">${tr("intro")}</p><h1>${tr("welcome")}</h1><p class="muted">${tr("overview")}</p></div><div class="logo">♡</div></div>
    ${connectionError ? `<div class="panel" style="margin-bottom:18px"><strong>${tr("loadError")}</strong><p class="muted">${esc(connectionError)}</p><button class="primary" onclick="retryLoad()">${tr("retry")}</button></div>` : `<div class="banner"><p>${tr("intro")}</p><h2>${tr("hero")}</h2><p>${tr("connected")}</p></div>`}
    <div class="stats">${stats.map(key => `<button class="stat" onclick="switchPage('${key}')"><div class="stat-label">${esc(label(key))}</div><div class="stat-number">${(data[key] || []).length}</div><div class="muted">${tr("items")} →</div></button>`).join("")}</div>
    <div class="columns">
      <section class="panel"><div class="panel-heading"><h3>${tr("recent")}</h3></div>
      ${recent.length ? recent.map(r => `<div class="activity"><strong>${esc(r.title || "")}</strong><br><span class="muted">${esc(label(r.module))} · ${formatDate(r.created_at || "")}</span></div>`).join("") : `<div class="empty">${tr("empty")}</div>`}
      </section>
      <section class="panel"><div class="panel-heading"><h3>${tr("quick")}</h3></div>
      ${quick.map(key => `<button class="quick" onclick="openForm('${key}')">${tables[key].icon} &nbsp; ${esc(label(key))} ＋</button>`).join("")}
      </section>
    </div>`;
}

function sectionPage(key) {
  const rows = (data[key] || []).filter(r => {
    const searchable = [r.title,r.description,r.status,r.caption,r.notes,r.platform,r.priority,r.role]
      .join(" ").toLowerCase();
    return searchable.includes(searchQuery.toLowerCase());
  });
  return `<div class="page-heading"><div><p class="eyebrow">DARAT COMMUNITY</p><h1>${esc(label(key))}</h1><p class="muted">${tr("overview")}</p></div><button class="primary" onclick="openForm('${key}')">＋ ${tr("add")}</button></div>
    <div class="toolbar"><input class="search" placeholder="${tr("search")}" value="${esc(searchQuery)}" oninput="filterPage(this.value)"><span class="muted">${rows.length} ${tr("items")}</span></div>
    ${rows.length ? `<div class="cards">${rows.map(r => renderCard(key,r)).join("")}</div>` : `<div class="empty"><h3>${tr("empty")}</h3><p>${searchQuery ? tr("noResults") : tr("emptyText")}</p><button class="primary" onclick="openForm('${key}')">＋ ${tr("add")}</button></div>`}`;
}

function renderCard(key,r) {
  const cfg = tables[key];
  const date = r.event_date || r.due_date || r.meeting_date || r.publish_date;
  const description = r.description || r.caption || r.notes || "";
  return `<article class="record">
    <div><span class="tag">${esc(label(key))}</span>${r.status ? ` <span class="tag">${esc(statusLabel(r.status))}</span>` : ""}</div>
    <h3>${esc(r.title || "")}</h3>
    ${description ? `<p class="record-description">${esc(description)}</p>` : ""}
    ${r.role ? `<p class="muted">${esc(statusLabel(r.role))}</p>` : ""}
    <div class="record-meta">${date ? esc(formatDate(date)) : ""}${r.priority ? " · " + esc(statusLabel(r.priority)) : ""}${r.platform ? " · " + esc(r.platform) : ""}</div>
    <div class="record-actions"><button class="secondary" onclick="openForm('${key}','${esc(r.id)}')">${tr("edit")}</button><button class="delete" onclick="deleteRecord('${key}','${esc(r.id)}')">${tr("delete")}</button></div>
  </article>`;
}

function filterPage(value) {
  searchQuery = value;
  const y = window.scrollY;
  render();
  window.scrollTo(0,y);
}

function openForm(key,id=null) {
  editing = id;
  const cfg = tables[key];
  const record = id ? (data[key] || []).find(r => String(r.id) === String(id)) : {};
  if (id && !record) {
    showToast("Item not found. Refresh the page and try again.");
    return;
  }

  const fields = cfg.fields.map(f => {
    let value = record?.[f.key] ?? "";
    let input;
    if (f.type === "textarea") {
      input = `<textarea name="${f.key}">${esc(value)}</textarea>`;
    } else if (f.type === "select") {
      input = `<select name="${f.key}">${f.options.map(o => `<option value="${esc(o)}" ${String(value) === o ? "selected" : ""}>${esc(statusLabel(o))}</option>`).join("")}</select>`;
    } else {
      input = `<input name="${f.key}" type="${f.type || "text"}" value="${esc(value)}" ${f.required ? "required" : ""}>`;
    }
    return `<div class="field"><label>${esc(fieldLabel(f))}${f.required ? " *" : ""}</label>${input}</div>`;
  }).join("");

  document.getElementById("modal-root").innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveRecord(event,'${key}')">
    <div class="modal-head"><h2>${id ? tr("editItem") : tr("newItem")} · ${esc(label(key))}</h2><button type="button" class="secondary" onclick="closeModal()">×</button></div>
    ${fields}
    <div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">${tr("cancel")}</button><button class="primary" id="save-button">${tr("save")}</button></div>
  </form></div>`;
}

function closeModal() {
  document.getElementById("modal-root").innerHTML = "";
  editing = null;
}

async function saveRecord(event,key) {
  event.preventDefault();
  if (busy) return;
  busy = true;
  const button = document.getElementById("save-button");
  if (button) button.disabled = true;

  try {
    const form = new FormData(event.target);
    const record = {};
    tables[key].fields.forEach(f => {
      const raw = String(form.get(f.key) || "").trim();
      record[f.key] = raw === "" && ["description","event_date","due_date","meeting_date","publish_date","notes","caption"].includes(f.key) ? null : raw;
    });

    let result;
    if (editing) {
      result = await db.from(key).update(record).eq("id",editing);
    } else {
      result = await db.from(key).insert(record);
    }
    if (result.error) throw result.error;

    closeModal();
    await refreshData();
    render();
    showToast(tr("saved"));
  } catch(error) {
    console.error("Save failed:",error);
    showToast("Save failed: " + (error.message || "Unknown error"));
  } finally {
    busy = false;
  }
}

async function deleteRecord(key,id) {
  if (busy || !confirm(tr("confirm"))) return;
  busy = true;
  try {
    const {error} = await db.from(key).delete().eq("id",id);
    if (error) throw error;
    await refreshData();
    render();
    showToast(tr("deleted"));
  } catch(error) {
    console.error("Delete failed:",error);
    showToast("Delete failed: " + (error.message || "Unknown error"));
  } finally {
    busy = false;
  }
}

function render() {
  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
  const content = page === "dashboard" ? dashboard() : sectionPage(page);
  document.getElementById("root").innerHTML = shell(content);
}

load();
</script>
</body>
</html>
